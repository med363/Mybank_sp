spring:
  application:
    name: Mybank

  datasource:
    # URL to the database. 'postgres' is the service name in docker-compose
    url: jdbc:postgresql://postgres:5432/mydatabase 
    username: myuser
    password: secret
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update # Automatically updates the database schema based on entities
    show-sql: true # Show SQL queries in the logs
    properties:
      hibernate:
        format_sql: true # Format the SQL for better readability

server:
  port: 8080 # Port where the application will run
